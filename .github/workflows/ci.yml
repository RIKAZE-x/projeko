name: VEILBOUND CI

on:
  push:
    branches: [main, feature/complex-rpg]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Build
        run: npm run build 2>&1 | tee build.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-ci-diagnostics
          path: |
            tsc.log
            build.log
          if-no-files-found: ignore
